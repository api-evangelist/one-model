aid: one-model
name: One Model
description: >-
  One Model is an HR and people-analytics software platform that unifies fragmented
  workforce data from HRIS, ATS, payroll, engagement, performance, and finance systems
  into a governed data mesh, then applies AI to turn it into insights for HR leaders
  and executives. Its products include Data Mesh (unify, govern, and activate data
  across sources), Data Stories (dashboards and reporting), One AI (a transparent
  predictive-modeling pipeline plus a natural-language assistant), and enterprise AI
  connections — including an MCP Server Access option — that let governed people data
  feed tools such as ChatGPT, Copilot, and Claude with role-based access controls.
  One Model is ISO 27001:2022 certified and SOC 2 Type II attested, and adheres to
  GDPR data-processor requirements.
